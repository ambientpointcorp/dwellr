# Standard R CMD check, plus the test suite that reproduces the book's printed
# numerical results. A change that breaks a worked example in the text fails
# here.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only. None of these jobs writes to the repository: results leave as an
# artifact or as the job's own status, and the runtime handles both without a
# repository scope. `read-all` would also work; `contents: read` is the
# narrower scope that matches what these jobs do.
permissions:
  contents: read

# One run per branch. A second push supersedes the first, and completing a
# check of superseded code costs minutes and publishes a status for a commit
# that is no longer the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # NOTE as error from the start. CRAN submission is planned but not
          # scheduled; keeping the package submission-clean continuously costs
          # less than clearing the notes in the week before submission.
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
