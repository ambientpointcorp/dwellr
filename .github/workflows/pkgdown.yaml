# Builds the reference site and publishes it to GitHub Pages.
#
# The reference index is _pkgdown.yml. pkgdown fails the build when a
# documented topic is missing from it, so a function added without being filed
# in the index is caught here.
#
# Tracks main: the site is rebuilt and republished on every push, so the
# published reference describes the code at the head of the branch rather than
# the code at the last release. A tag or release trigger would be redundant
# under that rule, since a release is cut from a commit that has already landed
# on main and already rebuilt the site.
#
# A pull request builds the site and stops. The build is the only check of
# _pkgdown.yml against the package, so without it a broken index would first be
# noticed once it had already landed on main.
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Publishing goes through the Pages artifact rather than a gh-pages branch, so
# nothing here needs to write to the repository and this is `contents: read`
# rather than the `contents: write` a branch deploy requires. Publish rights
# are granted to the deploy job alone.
permissions:
  contents: read

# Pages allows one deployment at a time. An in-progress run is left to finish
# rather than cancelled, as GitHub recommends for a production deployment.
# Queueing a newer run cancels whatever was still pending in the group, so a
# burst of commits leaves one build running and one queued rather than five
# builds of which only the last is published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and publish are separate jobs because a pull request must not
  # publish. Guarding a deploy step inside a single job would still attach
  # every pull-request run to the github-pages environment and record a
  # deployment against it, whereas a job that never starts does not.
  build:
    runs-on: ubuntu-latest
    env:
      # Dependency resolution reads the GitHub API, which is rate-limited for
      # anonymous callers and has a higher limit for authenticated ones.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `local::.` installs the package itself; pkgdown runs the examples on
      # every help page, so the Suggests have to be present or the reference
      # pages for the families that use them build without their output.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
