# Builds the reference site and publishes it to GitHub Pages.
#
# The site's reference index is _pkgdown.yml, which is organized by the
# chapter family each function belongs to rather than alphabetically, so the
# published reference doubles as the book's function index. pkgdown fails the
# build when a documented topic is missing from that index, which is what
# catches a new function added without being filed anywhere.
#
# Tracks main: the site is rebuilt and republished on every push, so the
# published reference always describes the code at the head of the branch
# rather than the code at the last release. A tag or release trigger would be
# redundant under that rule, since a release is cut from a commit that has
# already landed on main and already rebuilt the site.
name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second run would race the first for the same Pages deployment. An
# in-progress run is allowed to finish rather than being cancelled, which is
# what GitHub asks for a production deployment. A burst of commits is still
# cheap: when a new run is queued the concurrency group cancels whatever was
# already *pending* in it, so five pushes in a minute leave one build running
# and one queued, not five builds of a site only the last of which is visible.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `local::.` installs dwellr itself; pkgdown runs the examples on every
      # help page, so the Suggests have to be present or the reference pages
      # for the families that use them build without their output.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
