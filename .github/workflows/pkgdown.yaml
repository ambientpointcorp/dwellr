# Builds the reference site and publishes it to GitHub Pages.
#
# The reference index is _pkgdown.yml. pkgdown fails the build when a
# documented topic is missing from it, which is what catches a function added
# without being filed anywhere.
#
# Tracks main: the site is rebuilt and republished on every push, so the
# published reference describes the code at the head of the branch rather than
# the code at the last release. A tag or release trigger would be redundant
# under that rule, since a release is cut from a commit that has already landed
# on main and already rebuilt the site.
#
# A pull request builds the site and stops. That is worth the minutes: the
# build is the only thing that checks _pkgdown.yml against the package, and
# without it the first notice of a broken index is main already carrying it.
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Publishing goes through the Pages artifact rather than a gh-pages branch, so
# nothing here needs to write to the repository and this is `contents: read`
# rather than the `contents: write` a branch deploy requires. The rights to
# publish are granted to the deploy job alone.
permissions:
  contents: read

# Pages allows one deployment at a time. An in-progress run is left to finish
# rather than cancelled, which is what GitHub asks of a production deployment.
# Queueing a newer run cancels whatever was still pending in the group, so a
# burst of commits leaves one build running and one queued, not five builds of
# a site only the last of which anybody sees.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and publish are separate jobs because publishing is what a pull
  # request must not do. Guarding a deploy step inside a single job would still
  # attach every pull-request run to the github-pages environment and leave a
  # deployment recorded against it; a job that never starts cannot.
  build:
    runs-on: ubuntu-latest
    env:
      # Dependency resolution reads the GitHub API, which is rate-limited for
      # anonymous callers and generous for authenticated ones.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `local::.` installs the package itself; pkgdown runs the examples on
      # every help page, so the Suggests have to be present or the reference
      # pages for the families that use them build without their output.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
