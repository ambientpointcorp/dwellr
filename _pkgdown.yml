  - stage_validate
  - distribution_stage_spec
  - lead_time_decompose
  - degenerate_stages

- title: Measuring dwell time
  desc: Stage dwell under right-censoring.
  contents:
  - stage_dwell
  - dwell_survival
  - dwell_quantile
  - dwell_mean
  - dwell_hazard
  - dwell_parametric
  - dwell_mixture
  - dwell_competing
  - dwell_regression
  - stage_exit_type
  - observe_at
