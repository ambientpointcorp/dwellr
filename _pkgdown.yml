url: https://ambientpointcorp.github.io/dwellr/

template:
  bootstrap: 5

# Organized by chapter, so the reference doubles as the book's function index
# and Appendix E does not have to maintain a second copy of this list.
#
# pkgdown requires every documented topic to appear here exactly once, so this
# file is what fails when a chapter adds a function and forgets the index. Note
# that a topic is not always a function: `fc_benchmarks` documents four
# forecasting methods under one name, and the two roadmap entries each cover a
# family of declared stubs.
reference:
- title: Synthetic data
  desc: >
    Start here. Everything else runs against this, and the built-in dataset is
    one call to it.
  contents:
  - simulate_lifecycles
  - orders

- title: "Part I — Inventory systems"
  desc: Chapter 1. State derived from a ledger rather than maintained beside one.
  contents:
  - Warehouse

- title: "Part I — Deterministic models"
  desc: Chapter 2. Lot sizing under known, constant demand.
  contents:
  - eoq
  - eoq_cost
  - eoq_cost_interval
  - eoq_penalty
  - eoq_misestimate_penalty
  - eoq_quantity_discount
  - epq
  - backorder_policy
  - reorder_point
  - pow2_interval
  - pow2_bound
  - elsp_common_cycle
  - jrp
  - dls_wagner_whitin

- title: "Part I — Stochastic models and service levels"
  desc: Chapter 3. The newsvendor, the standard policies, and what service costs.
  contents:
  - nv_critical_fractile
  - nv_quantity
  - nv_quantity_for_service
  - nv_leftover
  - nv_shortfall
  - nv_cost
  - nv_service_levels
  - policy_base_stock
  - policy_ss
  - policy_rs
  - ss_cost

- title: "Part I — Demand forecasting"
  desc: Chapter 4. Benchmarks first, then accuracy, then what feeds safety stock.
  contents:
