url: https://ambientpointcorp.github.io/dwellr/

template:
  bootstrap: 5

  # pkgdown writes `\eqn` and `\deqn` out as TeX between `\(...\)` and
  # `$$...$$` and leaves the rendering to the browser. Its default,
  # `math-rendering: mathml`, only reaches the equations that pandoc converts
  # on the way through -- the home page and any vignettes -- so every formula
  # on a reference page stayed on the site as raw TeX. KaTeX is loaded on every
  # page instead, which is the one setting that covers the reference.
  math-rendering: katex

# Organized by topic. pkgdown requires every documented topic to appear here
# exactly once, so this file is what fails when a new function is added and the
# index is not updated. Note that a topic is not always a function:
# `fc_benchmarks` documents four forecasting methods under one name.
#
# The `url:` above has to agree with the one in DESCRIPTION: pkgdown refuses to
# build without the site URL recorded there, and R CMD check --as-cran follows
# the URLs it finds there. Both are satisfied only while the site is actually
# deployed, which .github/workflows/pkgdown.yaml is what keeps true.
reference:
- title: Lifecycle data
  desc: >
    Start here. Every other function reads a population in this shape, whether
    it was generated or recorded: the built-in dataset is one call to the
    generator, and `as_lifecycle()` builds the same object from an event log an
    operation already keeps.
  contents:
  - simulate_lifecycles
  - orders
  - as_lifecycle

- title: Inventory systems
  desc: State derived from a ledger rather than maintained beside one.
  contents:
  - Warehouse

- title: Deterministic models
  desc: Lot sizing under known, constant demand.
  contents:
  - eoq
  - eoq_cost
  - eoq_cost_interval
  - eoq_penalty
  - eoq_misestimate_penalty
  - eoq_quantity_discount
  - epq
  - backorder_policy
  - reorder_point
  - pow2_interval
  - pow2_bound
  - elsp_common_cycle
  - jrp
  - dls_wagner_whitin

- title: Stochastic models and service levels
  desc: The newsvendor, the standard policies, and what service costs.
  contents:
  - nv_critical_fractile
  - nv_quantity
  - nv_quantity_for_service
  - nv_leftover
  - nv_shortfall
  - nv_cost
  - nv_service_levels
  - policy_base_stock
  - policy_ss
  - policy_rs
  - ss_cost

- title: Demand forecasting
  desc: Benchmarks first, then accuracy, then what feeds safety stock.
  contents:
